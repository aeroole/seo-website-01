<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | จัดการบทความ</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: #f7f9fb;
    }
    .admin-header {
      background: #343a40;
      color: white;
      padding: 1rem;
    }
    textarea {
      width: 100%;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <h3 class="m-0">🛠️ แผงควบคุมผู้ดูแลระบบ</h3>
  </header>

  <main class="container py-4">
    <div class="mb-4">
      <h4>🎯 Hero Slider</h4>
      <button class="btn btn-sm btn-primary mb-2" onclick="addHero()">+ เพิ่ม Hero</button>
      <div id="heroList" class="list-group"></div>
    </div>

    <hr />

    <div>
      <h4>📰 จัดการบทความ</h4>
      <button class="btn btn-sm btn-primary mb-2" onclick="addArticle()">+ เพิ่มบทความ</button>
      <div id="articleList" class="list-group"></div>
    </div>
  </main>

  <script>
    let heroes = [];
    let articles = [];

    async function loadData() {
      try {
        const heroRes = await fetch("hero.json");
        heroes = await heroRes.json();
        renderHeroes();

        const articleRes = await fetch("articles.json");
        articles = await articleRes.json();
        renderArticles();
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    function renderHeroes() {
      const wrap = document.getElementById("heroList");
      wrap.innerHTML = "";
      heroes.forEach((h, i) => {
        const div = document.createElement("div");
        div.className = "list-group-item";
        div.innerHTML = `
          <input class="form-control mb-2" value="${h.title}" onchange="heroes[${i}].title=this.value" />
          <input class="form-control mb-2" value="${h.image}" onchange="heroes[${i}].image=this.value" />
          <input class="form-control mb-2" value="${h.link}" onchange="heroes[${i}].link=this.value" />
          <button class="btn btn-sm btn-danger" onclick="deleteHero(${i})">ลบ</button>
        `;
        wrap.appendChild(div);
      });
    }

    function renderArticles() {
      const wrap = document.getElementById("articleList");
      wrap.innerHTML = "";
      articles.forEach((a, i) => {
        const div = document.createElement("div");
        div.className = "list-group-item";
        div.innerHTML = `
          <input class="form-control mb-2" value="${a.title}" onchange="articles[${i}].title=this.value" />
          <input class="form-control mb-2" value="${a.excerpt}" onchange="articles[${i}].excerpt=this.value" />
          <input class="form-control mb-2" value="${a.image}" onchange="articles[${i}].image=this.value" />
          <input class="form-control mb-2" value="${a.category}" onchange="articles[${i}].category=this.value" />
          <textarea class="form-control mb-2" onchange="articles[${i}].body=this.value">${a.body}</textarea>
          <button class="btn btn-sm btn-danger" onclick="deleteArticle(${i})">ลบ</button>
        `;
        wrap.appendChild(div);
      });
    }

    function addHero() {
      heroes.push({ id: Date.now(), title: "", image: "", link: "#" });
      renderHeroes();
    }

    function deleteHero(i) {
      heroes.splice(i, 1);
      renderHeroes();
    }

    function addArticle() {
      articles.push({
        id: Date.now(),
        title: "",
        excerpt: "",
        body: "",
        image: "",
        category: "",
        author: "Admin",
        date: new Date().toISOString().split("T")[0],
      });
      renderArticles();
    }

    function deleteArticle(i) {
      articles.splice(i, 1);
      renderArticles();
    }

    loadData();
  </script>
</body>
</html>
