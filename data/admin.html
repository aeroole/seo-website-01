<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin จัดการเนื้อหาเว็บไซต์</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Prompt", sans-serif;
        background: #f5f7fa;
      }

      nav.navbar {
        background: #212529;
        color: #fff;
      }

      .navbar-brand {
        font-weight: 600;
      }

      .main-content {
        padding: 1.5rem;
        margin-top: 60px;
      }

      .mobile-sidebar {
        position: fixed;
        top: 0;
        left: -260px;
        width: 260px;
        height: 100%;
        background: #212529;
        color: white;
        padding: 1rem;
        transition: left 0.3s ease;
        z-index: 1050;
      }

      .mobile-sidebar.active {
        left: 0;
      }

      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1040;
      }

      .overlay.active {
        display: block;
      }

      .sidebar-search input {
        width: 100%;
        border-radius: 8px;
        padding: 6px 10px;
        border: none;
        outline: none;
      }

      .list-card {
        background: white;
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 1rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      }

      textarea {
        width: 100%;
        min-height: 80px;
      }

      .menu-toggle {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.5rem;
      }

      @media (max-width: 767px) {
        .navbar .menu-toggle {
          display: inline-block;
        }
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar fixed-top px-3 d-flex justify-content-between align-items-center"
    >
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <a href="#" class="navbar-brand text-white">Admin Panel</a>
    </nav>

    <div class="mobile-sidebar" id="mobileSidebar">
      <div class="sidebar-search mb-3">
        <input type="text" placeholder="ค้นหา..." />
      </div>
      <a href="#" class="d-block text-white mb-2">จัดการ Hero</a>
      <a href="#" class="d-block text-white mb-2">จัดการบทความ</a>
      <a href="#" class="d-block text-white">ออกจากระบบ</a>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <main class="main-content container">
      <div class="row">
        <div class="col-6">
          <h3 class="mb-4">🎯 จัดการ Hero Slider</h3>
          <button class="btn btn-sm btn-primary mb-3" onclick="addHero()">
            + เพิ่ม Hero
          </button>
          <div id="heroList"></div>
        </div>
        <div class="col-6">
          <h3 class="mb-4">📰 จัดการบทความ</h3>
          <button class="btn btn-sm btn-primary mb-3" onclick="addArticle()">
            + เพิ่มบทความ
          </button>
          <div id="articleList"></div>
        </div>
      </div>
    </main>

    <script>
      // 🔹 Toggle Sidebar
      function toggleSidebar() {
        document.getElementById("mobileSidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
      }

      let heroes = [];
      let articles = [];

      // ----------------------------------------------------
      // ⚙️ ฟังก์ชันสำหรับส่งข้อมูลไปเซิร์ฟเวอร์ (ต้องมี Backend รองรับ)
      // ----------------------------------------------------
      async function saveJsonToServer(data, filename) {
        // *** ตั้งค่า URL ของ Backend Script ของคุณที่นี่ ***
        const endpointUrl = "./../api/save_data.php";

        try {
          const response = await fetch(endpointUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ filename: filename, content: data }),
          });

          if (response.ok) {
            alert(`💾 บันทึกไฟล์ ${filename} บนเซิร์ฟเวอร์สำเร็จ!`);
          } else {
            // อ่านข้อความ Error จาก Server (ถ้า Server ส่งกลับมา)
            const errorText = await response.text();
            alert(
              `❌ เกิดข้อผิดพลาดในการบันทึกไฟล์ ${filename}: ${response.status} ${response.statusText}`
            );
            console.error("Server error response:", errorText);
          }
        } catch (error) {
          alert(`❌ ไม่สามารถเชื่อมต่อกับ Server ได้: ${error.message}`);
          console.error("Network or Fetch Error:", error);
        }
      }

      // ----------------------------------------------------
      // ⬇️ HERO SLIDER FUNCTIONS ⬇️
      // ----------------------------------------------------

      function renderHeroes() {
        const wrap = document.getElementById("heroList");
        wrap.innerHTML = "";

        heroes.forEach((h, i) => {
          const div = document.createElement("div");
          div.className = "list-card";
          div.innerHTML = `
              <input class="form-control mb-2" placeholder="id" value="${
                h.id
              }" onchange="heroes[${i}].id=this.value" />
              <input class="form-control mb-2" placeholder="ชื่อหัวข้อ" value="${
                h.title
              }" onchange="heroes[${i}].title=this.value" />
              <input class="form-control mb-2" placeholder="คำอธิบายสั้น" value="${
                h.excerpt || ""
              }" onchange="heroes[${i}].excerpt=this.value" />
              <input class="form-control mb-2" placeholder="URL รูปภาพ" value="${
                h.image
              }" onchange="heroes[${i}].image=this.value" />
              <div class="d-flex justify-content-end">
                <button class="btn btn-sm btn-danger" onclick="deleteHero(${i})">ลบ</button>
              </div>
            `;
          wrap.appendChild(div);
        });

        // ปุ่ม Save (Hero)
        const saveBtn = document.createElement("button");
        saveBtn.className = "btn btn-success mb-3 me-2";
        saveBtn.textContent = "💾 บันทึก Hero ทั้งหมด";
        saveBtn.onclick = () => saveJsonToServer(heroes, "sliders.json");

        const heroSection = document.getElementById("heroList").parentElement;
        // ป้องกันการสร้างปุ่มซ้ำ
        if (heroSection.querySelector(".btn-success") === null) {
          heroSection.insertBefore(
            saveBtn,
            document.getElementById("heroList")
          );
        }
      }

      function addHero() {
        // เพิ่มข้อมูลใหม่ที่ด้านหน้า (index 0)
        const maxIdH =
          heroes.length > 0 ? Math.max(...heroes.map((a) => a.id)) : 0;
        const newIdH = maxIdH + 1;

        heroes.unshift({
          id: newIdH,
          title: "Hero ใหม่",
          image: "",
          excerpt: "",
        });
        renderHeroes();
      }

      window.deleteHero = (i) => {
        if (confirm("ยืนยันการลบ Hero นี้?")) {
          heroes.splice(i, 1);
          renderHeroes();
        }
      };

      // ----------------------------------------------------
      // ⬇️ ARTICLE FUNCTIONS ⬇️
      // ----------------------------------------------------

      function renderArticles() {
        const wrap = document.getElementById("articleList");
        wrap.innerHTML = "";

        // เรียงลำดับบทความจาก id มากไปหาน้อย (ล่าสุดอยู่บนสุด)
        articles.sort((a, b) => b.id - a.id);

        articles.forEach((a, i) => {
          const div = document.createElement("div");
          div.className = "list-card";
          div.innerHTML = `
              <small class="text-muted d-block mb-1">ID: ${a.id} | วันที่: ${a.date}</small>
              <input class="form-control mb-2" placeholder="ชื่อบทความ" value="${a.title}" onchange="articles[${i}].title=this.value" />
              <input class="form-control mb-2" placeholder="คำอธิบายสั้น" value="${a.excerpt}" onchange="articles[${i}].excerpt=this.value" />
              <input class="form-control mb-2" placeholder="URL รูปภาพ" value="${a.image}" onchange="articles[${i}].image=this.value" />
              <input class="form-control mb-2" placeholder="หมวดหมู่" value="${a.category}" onchange="articles[${i}].category=this.value" />
              <textarea class="form-control mb-2" placeholder="เนื้อหาหลัก" onchange="articles[${i}].body=this.value">${a.body}</textarea>
              <input class="form-control mb-2" placeholder="ผู้เขียน" value="${a.author}" onchange="articles[${i}].author=this.value" />
              <div class="d-flex justify-content-end">
                <button class="btn btn-sm btn-danger" onclick="deleteArticle(${i})">ลบ</button>
              </div>
            `;
          wrap.appendChild(div);
        });

        // ปุ่ม Save (Article)
        const saveBtn = document.createElement("button");
        saveBtn.className = "btn btn-success mb-3 me-2";
        saveBtn.textContent = "💾 บันทึกบทความทั้งหมด";
        saveBtn.onclick = () => saveJsonToServer(articles, "articles.json");

        const articleSection =
          document.getElementById("articleList").parentElement;
        // ป้องกันการสร้างปุ่มซ้ำ
        if (articleSection.querySelector(".btn-success") === null) {
          articleSection.insertBefore(
            saveBtn,
            document.getElementById("articleList")
          );
        }
      }

      function addArticle() {
        // 1. หา ID สูงสุดปัจจุบัน
        const maxId =
          articles.length > 0 ? Math.max(...articles.map((a) => a.id)) : 0;
        const newId = maxId + 1; // ID ใหม่คือ ID สูงสุด + 1

        // 2. เพิ่มข้อมูลใหม่ที่ด้านหน้า (index 0)
        articles.unshift({
          id: newId,
          title: "",
          excerpt: "",
          body: "",
          image: "",
          category: "ทั่วไป",
          author: "Admin",
          date: new Date().toISOString().split("T")[0],
        });
        renderArticles();
      }

      window.deleteArticle = (i) => {
        if (confirm("ยืนยันการลบบทความนี้?")) {
          articles.splice(i, 1);
          renderArticles();
        }
      };

      // ----------------------------------------------------
      // ⬇️ INITIAL LOAD ⬇️
      // ----------------------------------------------------

      async function loadData() {
        try {
          const heroRes = await fetch("sliders.json");
          heroes = await heroRes.json();

          const articleRes = await fetch("articles.json");
          articles = await articleRes.json();

          renderHeroes();
          renderArticles();
        } catch (err) {
          console.error("โหลดข้อมูลไม่สำเร็จ (ตรวจสอบไฟล์ JSON):", err);
          heroes = [];
          articles = [];
          renderHeroes();
          renderArticles();
        }
      }

      loadData();
    </script>
  </body>
</html>
