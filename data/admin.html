<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin จัดการเนื้อหาเว็บไซต์</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Prompt", sans-serif;
        background: #f5f7fa;
      }

      nav.navbar {
        background: #212529;
        color: #fff;
      }

      .navbar-brand {
        font-weight: 600;
      }

      .main-content {
        padding: 1.5rem;
        margin-top: 60px;
      }

      .mobile-sidebar {
        position: fixed;
        top: 0;
        left: -260px;
        width: 260px;
        height: 100%;
        background: #212529;
        color: white;
        padding: 1rem;
        transition: left 0.3s ease;
        z-index: 1050;
      }

      .mobile-sidebar.active {
        left: 0;
      }

      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1040;
      }

      .overlay.active {
        display: block;
      }

      .sidebar-search input {
        width: 100%;
        border-radius: 8px;
        padding: 6px 10px;
        border: none;
        outline: none;
      }

      .list-card {
        background: white;
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 1rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      }

      textarea {
        width: 100%;
        min-height: 80px;
      }

      .menu-toggle {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.5rem;
      }

      @media (max-width: 767px) {
        .navbar .menu-toggle {
          display: inline-block;
        }
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar fixed-top px-3 d-flex justify-content-between align-items-center"
    >
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <a href="#" class="navbar-brand text-white">Admin Panel</a>
    </nav>

    <div class="mobile-sidebar" id="mobileSidebar">
      <div class="sidebar-search mb-3">
        <input type="text" placeholder="ค้นหา..." />
      </div>
      <a href="#" class="d-block text-white mb-2">จัดการ Hero</a>
      <a href="#" class="d-block text-white mb-2">จัดการบทความ</a>
      <a href="#" class="d-block text-white">ออกจากระบบ</a>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <main class="main-content container">
      <h3 class="mb-4">🎯 จัดการ Hero Slider</h3>
      <button class="btn btn-sm btn-primary mb-3" onclick="addHero()">
        + เพิ่ม Hero
      </button>
      <div id="heroList"></div>

      <hr />

      <h3 class="mb-4">📰 จัดการบทความ</h3>
      <button class="btn btn-sm btn-primary mb-3" onclick="addArticle()">
        + เพิ่มบทความ
      </button>
      <div id="articleList"></div>
    </main>

    <script>
      // 🔹 Toggle Sidebar
      function toggleSidebar() {
        document.getElementById("mobileSidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
      }

      let heroes = [];
      let articles = [];

      async function loadData() {
        try {
<<<<<<< HEAD
          const heroRes = await fetch("silders.json");
=======
          const heroRes = await fetch("sliders.json");
>>>>>>> parent of 36287c5 (fix bug)
          heroes = await heroRes.json();
          renderHeroes();

          const articleRes = await fetch("articles.json");
          articles = await articleRes.json();
          renderArticles();
        } catch (err) {
          console.error("โหลดข้อมูลไม่สำเร็จ:", err);
        }
      }

      function renderHeroes() {
        const wrap = document.getElementById("heroList");
        wrap.innerHTML = "";
        heroes.forEach((h, i) => {
          const div = document.createElement("div");
          div.className = "list-card";
          div.innerHTML = `
            <input class="form-control mb-2" placeholder="ชื่อหัวข้อ" value="${h.title}" onchange="heroes[${i}].title=this.value" />
            <input class="form-control mb-2" placeholder="URL รูปภาพ" value="${h.image}" onchange="heroes[${i}].image=this.value" />
            <input class="form-control mb-2" placeholder="ลิงก์" value="${h.link}" onchange="heroes[${i}].link=this.value" />
            <button class="btn btn-sm btn-danger" onclick="deleteHero(${i})">ลบ</button>
          `;
          wrap.appendChild(div);
        });
      }

      function renderArticles() {
        const wrap = document.getElementById("articleList");
        wrap.innerHTML = "";
        articles.forEach((a, i) => {
          const div = document.createElement("div");
          div.className = "list-card";
          div.innerHTML = `
            <input class="form-control mb-2" placeholder="ชื่อบทความ" value="${a.title}" onchange="articles[${i}].title=this.value" />
            <input class="form-control mb-2" placeholder="คำอธิบายสั้น" value="${a.excerpt}" onchange="articles[${i}].excerpt=this.value" />
            <input class="form-control mb-2" placeholder="URL รูปภาพ" value="${a.image}" onchange="articles[${i}].image=this.value" />
            <input class="form-control mb-2" placeholder="หมวดหมู่" value="${a.category}" onchange="articles[${i}].category=this.value" />
            <textarea class="form-control mb-2" placeholder="เนื้อหาหลัก" onchange="articles[${i}].body=this.value">${a.body}</textarea>
            <input class="form-control mb-2" placeholder="ผู้เขียน" value="${a.author}" onchange="articles[${i}].author=this.value" />
            <button class="btn btn-sm btn-danger" onclick="deleteArticle(${i})">ลบ</button>
          `;
          wrap.appendChild(div);
        });
      }

      function addHero() {
        heroes.push({ id: Date.now(), title: "", image: "", link: "#" });
        renderHeroes();
      }

      function deleteHero(i) {
        heroes.splice(i, 1);
        renderHeroes();
      }

      function addArticle() {
        articles.push({
          id: Date.now(),
          title: "",
          excerpt: "",
          body: "",
          image: "",
          category: "",
          author: "",
          date: new Date().toISOString().split("T")[0],
        });
        renderArticles();
      }

      function deleteArticle(i) {
        articles.splice(i, 1);
        renderArticles();
      }

      loadData();
    </script>
  </body>
</html>
